<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kulak Haritaları ve Anatomi Atlası</title>

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        -webkit-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      img {
        -webkit-user-drag: none;
        user-drag: none;
        pointer-events: none;
      }

      body {
        display: flex;
        height: 100vh;
        background-color: #f4f6f9;
      }

      /* Giriş Ekranı Stili */
      #auth-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(15, 23, 42, 0.95);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }
      .auth-card {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        width: 90%;
        max-width: 400px;
        text-align: center;
      }
      .auth-card h2 {
        margin-bottom: 10px;
        color: #1e293b;
        font-size: 1.4rem;
      }
      .auth-card p {
        font-size: 0.85rem;
        color: #64748b;
        margin-bottom: 20px;
        line-height: 1.4;
      }
      .auth-card input {
        width: 100%;
        padding: 12px;
        margin-bottom: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 0.95rem;
        -webkit-user-select: text;
        user-select: text;
      }
      .auth-card button {
        width: 100%;
        padding: 12px;
        background: #4f46e5;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 0.95rem;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
      }
      .auth-card button:hover {
        background: #4338ca;
      }
      #auth-message {
        margin-top: 15px;
        font-size: 0.85rem;
        word-break: break-word;
      }

      /* Ana Uygulama Düzeni */
      .container {
        display: none !important;
        width: 100%;
        min-height: 100vh;
        transition: filter 0.3s;
      }
      body.authenticated .container {
        display: flex !important;
      }

      .sidebar {
        width: 340px;
        background: #ffffff;
        border-right: 1px solid #e0e0e0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        flex-shrink: 0;
      }
      .sidebar-content {
        overflow-y: auto;
        flex: 1;
        max-height: 480px;
      }
      .sidebar h2 {
        margin-bottom: 15px;
        font-size: 1.2rem;
        color: #333;
      }
      .sidebar input[type="text"] {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 6px;
        -webkit-user-select: text;
        user-select: text;
      }
      .sidebar ul {
        list-style: none;
      }
      .sidebar li {
        padding: 10px;
        border-bottom: 1px solid #eee;
        cursor: pointer;
        border-radius: 4px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 42px;
      }
      .sidebar li:hover {
        background-color: #eef2ff;
        color: #4f46e5;
      }
      .map-title {
        flex: 1;
        font-weight: 500;
      }

      .action-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 0.9rem;
        padding: 2px 4px;
        opacity: 0.7;
        display: none;
      }
      .action-btn:hover {
        opacity: 1;
      }

      .add-form {
        border-top: 1px solid #eee;
        padding-top: 15px;
        margin-top: 15px;
        display: none;
      }

      .form-accordion summary {
        list-style: none;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        user-select: none;
      }
      .form-accordion summary::-webkit-details-marker {
        display: none;
      }

      .accordion-icon {
        font-size: 0.8rem;
        transition: transform 0.2s ease;
        display: none;
      }
      .form-accordion[open] .accordion-icon {
        transform: rotate(180deg);
      }

      .add-form label {
        font-size: 0.75rem;
        color: #666;
        display: block;
        margin-top: 6px;
      }
      .add-form input,
      .add-form textarea,
      .add-form button {
        width: 100%;
        margin-bottom: 8px;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 0.85rem;
        -webkit-user-select: text;
        user-select: text;
      }
      .add-form textarea {
        resize: vertical;
        height: 70px;
      }
      .btn-group {
        display: flex;
        gap: 5px;
        margin-top: 5px;
      }
      .add-form button {
        background: #4f46e5;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: bold;
        padding: 10px;
      }
      #cancel-btn {
        background: #6b7280;
        display: none;
      }

      .user-panel {
        border-top: 1px solid #e2e8f0;
        padding-top: 10px;
        margin-top: 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .user-email-text {
        font-size: 0.75rem;
        color: #475569;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .admin-toggle-btn,
      .logout-btn,
      .nav-link-btn {
        padding: 6px 10px;
        font-size: 0.75rem;
        background: transparent;
        border: 1px dashed #cbd5e1;
        color: #64748b;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
        text-decoration: none;
        text-align: center;
        display: block;
      }
      .admin-toggle-btn:hover,
      .nav-link-btn:hover {
        background: #f1f5f9;
        color: #334155;
      }
      .nav-link-btn {
        border-style: solid;
        border-color: #4f46e5;
        color: #4f46e5;
        font-weight: 600;
      }
      .logout-btn {
        border-style: solid;
        border-color: #fca5a5;
        color: #dc2626;
      }
      .logout-btn:hover {
        background: #fef2f2;
      }

      .content {
        flex: 1;
        padding: 30px;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-y: auto;
      }
      .content h1 {
        margin-bottom: 15px;
        color: #111827;
        text-align: center;
      }

      .text-slider-wrapper {
        position: relative;
        width: 100%;
        max-width: 750px;
        margin-bottom: 20px;
        display: none;
        align-items: center;
      }

      .points-container {
        width: 100%;
        background: #ffffff;
        border-left: 5px solid #059669;
        padding: 18px 22px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        min-height: 140px;
      }
      .points-title {
        font-size: 0.9rem;
        font-weight: bold;
        color: #059669;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .text-details-content {
        color: #374151;
        font-size: 0.95rem;
        line-height: 1.6;
        white-space: pre-line;
        background: #f8fafc;
        padding: 12px;
        border-radius: 6px;
        border: 1px solid #e2e8f0;
        max-height: 350px;
        overflow-y: auto;
      }

      .slider-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        max-width: 750px;
      }
      .image-card {
        background: white;
        padding: 15px;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        width: 100%;
        text-align: center;
      }
      .image-card img {
        max-width: 100%;
        height: auto;
        max-height: 500px;
        border-radius: 8px;
        object-fit: contain;
      }

      .nav-arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(5, 150, 105, 0.85);
        color: white;
        border: none;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        font-size: 1.2rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        transition: 0.2s;
        z-index: 10;
      }
      .nav-arrow:hover {
        background: #059669;
        transform: translateY(-50%) scale(1.1);
      }
      .arrow-left {
        left: -20px;
      }
      .arrow-right {
        right: -20px;
      }

      @media (max-width: 1024px) {
        body {
          height: auto;
          overflow-x: hidden;
        }
        .container {
          flex-direction: column;
        }
        .sidebar {
          width: 100%;
          border-right: none;
          border-bottom: 1px solid #e0e0e0;
        }
        .content {
          padding: 15px;
          width: 100%;
        }
        .accordion-icon {
          display: inline-block;
        }
        .form-accordion summary {
          background: #f8fafc;
          padding: 10px;
          border-radius: 6px;
          border: 1px solid #e2e8f0;
        }
        .add-form-content {
          padding-top: 10px;
        }
        .arrow-left {
          left: 5px;
        }
        .arrow-right {
          right: 5px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Giriş / Login Modalı -->
    <div id="auth-container">
      <div class="auth-card">
        <h2>Harita Atlası Girişi</h2>
        <p>Yetkili e-posta adresinizle oturum açın.</p>
        <input
          type="email"
          id="login-email"
          placeholder="E-posta adresiniz..."
          required
        />
        <button id="login-btn" onclick="handleLogin()">
          Giriş Bağlantısı Gönder
        </button>
        <div id="auth-message"></div>
      </div>
    </div>

    <!-- Ana Uygulama Gövdesi -->
    <div class="container">
      <aside class="sidebar">
        <div class="sidebar-content">
          <h2>Kulak Haritaları</h2>
          <input
            type="text"
            id="search"
            placeholder="Harita / Bölge ara..."
            onkeyup="filterMaps()"
          />
          <ul id="map-list"></ul>
        </div>

        <!-- Kullanıcı Paneli & Admin Butonları -->
        <div class="user-panel">
          <span class="user-email-text" id="current-user-email"></span>
          <a href="index.html" class="nav-link-btn"
            >📋 Tedavi Protokollerine Dön</a
          >
          <button
            class="admin-toggle-btn"
            id="admin-btn"
            onclick="toggleAdminMode()"
          >
            🔐 Admin Girişi
          </button>
          <button class="logout-btn" onclick="handleLogout()">
            🚪 Oturumu Kapat
          </button>
        </div>

        <!-- Admin Formu -->
        <div class="add-form" id="admin-form-container">
          <details class="form-accordion" id="form-accordion" open>
            <summary>
              <h3 id="form-header" style="display: inline-block">
                Yeni Harita Ekle
              </h3>
              <span class="accordion-icon">▼</span>
            </summary>
            <div class="add-form-content">
              <input
                type="text"
                id="new-title"
                placeholder="Harita / Bölge Adı (Örn: Somatotopik Kulak Bölümleri)"
              />
              <textarea
                id="new-notes"
                placeholder="Harita Detayları ve Anatomik Açıklamalar"
              ></textarea>

              <label>Harita Görseli (Çoklu Seçebilirsiniz):</label>
              <input type="file" id="new-img1" accept="image/*" multiple />

              <div class="btn-group">
                <button id="save-btn" onclick="addNewMap()">
                  Kaydet ve Ekle
                </button>
                <button id="cancel-btn" onclick="resetForm()">İptal</button>
              </div>
            </div>
          </details>
        </div>
      </aside>

      <main class="content">
        <h1 id="title">Bir Kulak Haritası Seçin</h1>

        <div class="text-slider-wrapper" id="text-slider-wrapper">
          <div class="points-container" id="points-box">
            <div class="points-title" id="text-card-title">Anatomik Bilgi</div>
            <div class="text-details-content" id="notes-content"></div>
          </div>
        </div>

        <div class="slider-wrapper" id="card" style="display: none">
          <button
            class="nav-arrow arrow-left"
            onclick="changeImage(-1)"
            id="prev-btn"
          >
            ◀
          </button>
          <div class="image-card">
            <img
              id="map-image"
              src=""
              alt="Kulak Haritası Görseli"
              oncontextmenu="return false;"
            />
          </div>
          <button
            class="nav-arrow arrow-right"
            onclick="changeImage(1)"
            id="next-btn"
          >
            ▶
          </button>
        </div>
      </main>
    </div>

    <script>
      const SUPABASE_URL = "https://bxdieehllivgsywsyusu.supabase.co";
      const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_CduozESdThk6nrsqlHGcbw_fu8WxBOQ";

      const _supabase = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
          },
        },
      );

      const ADMIN_PASSWORD = "1234";
      let isAdmin = false;

      let mapsData = [];
      let editingId = null;
      let currentImages = [];
      let currentImageIndex = 0;

      // Koruma
      document.addEventListener("contextmenu", (event) =>
        event.preventDefault(),
      );

      async function checkAuthSession() {
        try {
          const { data } = await _supabase.auth.getSession();
          await handleUserSession(data ? data.session : null);
        } catch (err) {
          console.error("Session hatası:", err);
        }
      }

      async function handleUserSession(session) {
        if (session && session.user) {
          const userEmail = session.user.email
            ? session.user.email.toLowerCase().trim()
            : "";

          try {
            const { data: allowedData } = await _supabase
              .from("allowed_users")
              .select("email");
            const isAllowed =
              allowedData &&
              allowedData.some(
                (row) =>
                  row.email && row.email.toLowerCase().trim() === userEmail,
              );

            if (!isAllowed) {
              await _supabase.auth.signOut();
              document.body.classList.remove("authenticated");
              document.getElementById("auth-container").style.display = "flex";
              return;
            }

            document.body.classList.add("authenticated");
            document.getElementById("auth-container").style.display = "none";
            document.getElementById("current-user-email").textContent =
              `👤 ${userEmail}`;

            if (window.location.hash) {
              history.replaceState(
                null,
                document.title,
                window.location.pathname + window.location.search,
              );
            }

            loadMapsFromCloud();
          } catch (err) {
            console.error(err);
          }
        } else {
          document.body.classList.remove("authenticated");
          document.getElementById("auth-container").style.display = "flex";
        }
      }

      async function handleLogin() {
        const emailInput = document
          .getElementById("login-email")
          .value.toLowerCase()
          .trim();
        if (!emailInput) return;

        const { error } = await _supabase.auth.signInWithOtp({
          email: emailInput,
          options: { emailRedirectTo: window.location.href },
        });

        if (error) alert("Hata: " + error.message);
        else alert("Giriş bağlantısı e-postanıza gönderildi.");
      }

      async function handleLogout() {
        await _supabase.auth.signOut();
        window.location.reload();
      }

      function toggleAdminMode() {
        if (isAdmin) {
          isAdmin = false;
          document.getElementById("admin-form-container").style.display =
            "none";
          document.getElementById("admin-btn").textContent = "🔐 Admin Girişi";
          renderList(mapsData);
        } else {
          const password = prompt("Yönetici Şifrenizi Girin:");
          if (password === ADMIN_PASSWORD) {
            isAdmin = true;
            document.getElementById("admin-form-container").style.display =
              "block";
            document.getElementById("admin-btn").textContent =
              "🔓 Çıkış Yap (Admin)";
            renderList(mapsData);
          } else if (password !== null) {
            alert("Hatalı şifre!");
          }
        }
      }

      async function loadMapsFromCloud() {
        const { data, error } = await _supabase
          .from("ear_maps")
          .select("*")
          .order("name", { ascending: true });

        if (error) {
          console.error("Yükleme hatası:", error);
          return;
        }

        mapsData = data || [];
        renderList(mapsData);
      }

      function renderList(list) {
        const listElement = document.getElementById("map-list");
        listElement.innerHTML = "";

        list.forEach((item) => {
          const li = document.createElement("li");

          const titleSpan = document.createElement("span");
          titleSpan.className = "map-title";
          titleSpan.textContent = item.name;
          titleSpan.onclick = () => showDetail(item);

          const editBtn = document.createElement("button");
          editBtn.className = "action-btn";
          editBtn.innerHTML = "✏️";
          editBtn.style.display = isAdmin ? "inline-block" : "none";
          editBtn.onclick = (e) => {
            e.stopPropagation();
            openEditMode(item);
          };

          const deleteBtn = document.createElement("button");
          deleteBtn.className = "action-btn";
          deleteBtn.innerHTML = "🗑️";
          deleteBtn.style.display = isAdmin ? "inline-block" : "none";
          deleteBtn.onclick = (e) => {
            e.stopPropagation();
            deleteMap(item.id);
          };

          const btnContainer = document.createElement("div");
          btnContainer.appendChild(editBtn);
          btnContainer.appendChild(deleteBtn);

          li.appendChild(titleSpan);
          li.appendChild(btnContainer);
          listElement.appendChild(li);
        });
      }

      function showDetail(item) {
        document.getElementById("title").textContent = item.name;

        const sliderWrapper = document.getElementById("text-slider-wrapper");
        const notesContent = document.getElementById("notes-content");

        if (item.notes && item.notes.trim() !== "") {
          notesContent.textContent = item.notes;
          sliderWrapper.style.display = "flex";
        } else {
          sliderWrapper.style.display = "none";
        }

        currentImages = Array.isArray(item.images) ? item.images : [];
        currentImages = currentImages.filter((img) => img);
        currentImageIndex = 0;

        updateSlider();
        document.getElementById("card").style.display =
          currentImages.length > 0 ? "flex" : "none";
      }

      function updateSlider() {
        const img = document.getElementById("map-image");
        img.src = currentImages[currentImageIndex] || "";

        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");

        if (currentImages.length <= 1) {
          prevBtn.style.display = "none";
          nextBtn.style.display = "none";
        } else {
          prevBtn.style.display = "flex";
          nextBtn.style.display = "flex";
        }
      }

      function changeImage(direction) {
        currentImageIndex += direction;
        if (currentImageIndex < 0) currentImageIndex = currentImages.length - 1;
        if (currentImageIndex >= currentImages.length) currentImageIndex = 0;
        updateSlider();
      }

      function filterMaps() {
        const text = document.getElementById("search").value.toLowerCase();
        const filtered = mapsData.filter((m) =>
          m.name.toLowerCase().includes(text),
        );
        renderList(filtered);
      }

      function openEditMode(item) {
        if (!isAdmin) return;
        editingId = item.id;
        document.getElementById("form-header").textContent =
          "Haritayı Güncelle";
        document.getElementById("new-title").value = item.name;
        document.getElementById("new-notes").value = item.notes || "";

        document.getElementById("form-accordion").setAttribute("open", "");

        const saveBtn = document.getElementById("save-btn");
        saveBtn.textContent = "Güncelle ve Kaydet";
        saveBtn.style.background = "#059669";
        document.getElementById("cancel-btn").style.display = "block";
      }

      async function uploadImageToStorage(file) {
        const cleanName = file.name
          .replace(/ğ/g, "g")
          .replace(/Ğ/g, "G")
          .replace(/ü/g, "u")
          .replace(/Ü/g, "U")
          .replace(/ş/g, "s")
          .replace(/Ş/g, "S")
          .replace(/ı/g, "i")
          .replace(/İ/g, "I")
          .replace(/ö/g, "o")
          .replace(/Ö/g, "O")
          .replace(/ç/g, "c")
          .replace(/Ç/g, "C")
          .replace(/[^a-zA-Z0-9.-]/g, "_");

        const fileName = `map_${Date.now()}_${cleanName}`;

        const { error } = await _supabase.storage
          .from("protocol-images") // Aynı bucket kullanılabilir veya ayrı bucket oluşturulabilir
          .upload(fileName, file);

        if (error) {
          alert("Görsel yüklenemedi: " + error.message);
          return null;
        }

        const { data: publicUrlData } = _supabase.storage
          .from("protocol-images")
          .getPublicUrl(fileName);

        return publicUrlData.publicUrl;
      }

      async function addNewMap() {
        if (!isAdmin) return;

        const title = document.getElementById("new-title").value;
        const notes = document.getElementById("new-notes").value;
        const fileInput1 = document.getElementById("new-img1");

        if (!title) {
          alert("Lütfen harita başlığını girin!");
          return;
        }

        const saveBtn = document.getElementById("save-btn");
        saveBtn.textContent = "Yükleniyor...";
        saveBtn.disabled = true;

        let newImages = [];
        if (fileInput1.files.length > 0) {
          for (let i = 0; i < fileInput1.files.length; i++) {
            const url = await uploadImageToStorage(fileInput1.files[i]);
            if (url) newImages.push(url);
          }
        }

        if (editingId) {
          const existing = mapsData.find((m) => m.id === editingId);
          const updatedImages =
            newImages.length > 0 ? newImages : existing ? existing.images : [];

          const { error } = await _supabase
            .from("ear_maps")
            .update({ name: title, notes: notes, images: updatedImages })
            .eq("id", editingId);

          if (error) alert("Güncelleme hatası: " + error.message);
        } else {
          const { error } = await _supabase
            .from("ear_maps")
            .insert([{ name: title, notes: notes, images: newImages }]);

          if (error) alert("Kayıt hatası: " + error.message);
        }

        saveBtn.disabled = false;
        await loadMapsFromCloud();
        resetForm();
      }

      async function deleteMap(id) {
        if (!isAdmin) return;
        if (confirm("Bu haritayı silmek istediğinize emin misiniz?")) {
          const { error } = await _supabase
            .from("ear_maps")
            .delete()
            .eq("id", id);

          if (error) {
            alert("Silme hatası: " + error.message);
            return;
          }

          await loadMapsFromCloud();
          document.getElementById("card").style.display = "none";
          document.getElementById("text-slider-wrapper").style.display = "none";
          document.getElementById("title").textContent =
            "Bir Kulak Haritası Seçin";
        }
      }

      function resetForm() {
        editingId = null;
        document.getElementById("form-header").textContent = "Yeni Harita Ekle";
        document.getElementById("new-title").value = "";
        document.getElementById("new-notes").value = "";
        document.getElementById("new-img1").value = "";

        const saveBtn = document.getElementById("save-btn");
        saveBtn.textContent = "Kaydet ve Ekle";
        saveBtn.style.background = "#4f46e5";
        document.getElementById("cancel-btn").style.display = "none";
      }

      checkAuthSession();
    </script>
  </body>
</html>
